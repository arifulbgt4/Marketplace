name: Marketplace quality gates

on:
  push:
    branches: ["dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PRISMA_URL: postgresql://marketplace_user:marketplace_password@localhost:5432/marketplace
  POSTGRES_URL_NON_POOLING: postgresql://marketplace_user:marketplace_password@localhost:5432/marketplace
  NEXTAUTH_SECRET: ci-only-secret-that-is-at-least-thirty-two-characters
  NEXTAUTH_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_DOMAIN_URL: http://127.0.0.1:3100/
  NEXT_PUBLIC_MARKETPLACE_NAME: Marketplace CI
  NEXT_PUBLIC_CURRENCY_CODE: USD
  NEXT_PUBLIC_CURRENCY_SYMBOL: $
  NEXT_PUBLIC_CURRENCY_LOCALE: en-US
  MOCK_PAYMENT_WEBHOOK_SECRET: ci-only-payment-webhook-secret-at-least-32-characters

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace_user
          POSTGRES_PASSWORD: marketplace_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace_user -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment
        run: pnpm env:check

      - name: Validate and deploy migrations
        run: |
          pnpm exec prisma validate
          pnpm db:migrate:prod

      - name: Seed isolated CI database
        run: pnpm db:seed

      - name: Static and unit gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm type-check
          pnpm test:coverage

      - name: Database integration gate
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser, accessibility and visual gates
        run: pnpm test:e2e
        env:
          E2E_MANAGE_SERVER: "true"
          E2E_DATABASE_URL: postgresql://marketplace_user:marketplace_password@localhost:5432/marketplace
          E2E_BASE_URL: http://127.0.0.1:3100

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
